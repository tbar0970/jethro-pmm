# Define services for a working Jethro development environment (nginx
# webserver, php-fpm backend, mariadb database).
# See https://www.jetify.com/docs/devbox/guides/services
#
# Usage:
#   devbox services up -b          # Start all in background
#   devbox services ls             # Show status
#   devbox services stop           # Stop all
#
version: "0.5"

#on_ready:
  #command: printf 'Selected Jethro services have finished startup checks.\n'

processes:

  jethro:
    description: "A demo Jethro for development, at http://localhost:${NGINX_WEB_PORT}"
    depends_on: 
      nginx:
        condition: process_healthy
      jethro_database_setup:
        condition: process_completed_successfully
      composer_install:
        condition: process_completed_successfully
    availability:
      restart: "no"

  jethro_database_setup:
    description: Ensures the 'jethro' database/user exists
    depends_on: 
      mariadb:
        condition: process_healthy
    # Non-destructive: keeps whatever is already in the database.
    # To wipe and start over: devbox run initdb
    command: devbox.d/bin/mariadb_ensure_db jethro
    on_exit:
      command: |
        if [ "$PC_EXIT_CODE" = 0 ]; then
          : #printf 'Jethro database ready; existing data preserved.\n'
        elif [ "$PC_STOP_REASON" = none ]; then
          printf 'Jethro database setup failed (exit %s); application startup is blocked.\n' "$PC_EXIT_CODE" >&2
        fi
    readiness_probe:
      exec:
        command: mariadb jethro -sNBe "select database();"
      # 1s delay, then ping every 1 second until up (try 15 times), and then every 20s
      initial_delay_seconds: 1
      startup_period_seconds: 1
      period_seconds: 20
      timeout_seconds: 5
      failure_threshold: 15

  composer_install:
    description: Installs PHP dependencies (vendor/) with Composer
    # Idempotent: with vendor/ already up to date this is a fast no-op; on a
    # fresh checkout it populates vendor/ from composer.lock. Composer is
    # provided by the php package in the devbox nix environment.
    command: composer install --no-interaction --no-progress
    on_exit:
      command: |
        if [ "$PC_STOP_REASON" = none ] && [ "$PC_EXIT_CODE" != 0 ]; then
          printf 'PHP dependency installation failed (exit %s); application startup is blocked.\n' "$PC_EXIT_CODE" >&2
        fi
    availability:
      restart: "no"

  # Nginx's service is defined by a devbox plugin, in .devbox/virtenv/nginx/process-compose.yaml
  # We extend it a bit here to make "successful startup" depend on php-fpm and the access/error log watchers being started
  nginx:
    on_ready:
      command: |
        if [ -z "$PC_TCP_PORTS" ]; then
          printf 'Jethro nginx passed readiness checks, but no TCP port was discovered (discovery: %s).\n' "$PC_PORTS_STATUS"
        fi
        for port in $PC_TCP_PORTS; do
          printf '%-57s%s\n' 'Jethro nginx ready:' "http://localhost:$port/"
        done
    on_exit:
      command: |
        if [ "$PC_STOP_REASON" = none ]; then
          printf 'Jethro nginx exited unexpectedly (exit %s); check the nginx service log.\n' "$PC_EXIT_CODE" >&2
        fi
    depends_on: 
      nginx-error:
        condition: process_started
      nginx-access:
        condition: process_started
      php-fpm:
        condition: process_started


  functest_jethro_server:
    description: A Jethro instance just for functional tests
    on_ready:
      command: |
        if [ -z "$PC_TCP_PORTS" ]; then
          printf 'Functional-test server passed readiness checks, but no TCP port was discovered (discovery: %s).\n' "$PC_PORTS_STATUS"
        fi
        for port in $PC_TCP_PORTS; do
          printf '%-57s%s\n' 'Functional-test server ready:' "http://localhost:$port/"
        done
    on_exit:
      command: |
        if [ "$PC_STOP_REASON" = none ]; then
          printf 'Functional-test server exited unexpectedly (exit %s); check its service log.\n' "$PC_EXIT_CODE" >&2
        fi
    command: |
      set -eu
      export NGINX_WEB_ROOT="${NGINX_WEB_ROOT/web/functest_jethro_server}"
      export NGINX_WEB_PORT=${FUNCTEST_WEB_PORT}
      envsubst $(awk 'BEGIN {for (k in ENVIRON) {printf "$"k","}}') < $NGINX_CONFDIR/nginx.template > $NGINX_CONFDIR/nginx-functest.conf
      # Own pid file: the devbox nginx plugin's instance uses the same -p prefix
      # and writes nginx.pid there, so sharing it makes each instance unlink the
      # other's pid file on shutdown ("unlink() nginx.pid failed" alerts).
      nginx -p $NGINX_PATH_PREFIX -c $NGINX_CONFDIR/nginx-functest.conf -e error.log -g "pid nginx-functest.pid;daemon off;"
    depends_on:
      mariadb:
        condition: process_healthy
      functest_databases_setup:
        condition: process_completed_successfully
      composer_install:
        condition: process_completed_successfully
    availability:
      restart: on_failure
      # FYI: A transient server stall can burn all 5 restarts and leave port
      # ${FUNCTEST_WEB_PORT} dead for the rest of the session, so every
      # subsequent test fails with ERR_CONNECTION_REFUSED. Don't increase
      # max_restarts despite that, as it's better to fail hard than slow.
      max_restarts: 5
    readiness_probe:
      http_get:
        host: localhost
        port: ${FUNCTEST_WEB_PORT}
        path: /
      # 1s delay, then ping every 1 second until up (try 15 times), and then every 20s.
      initial_delay_seconds: 1
      startup_period_seconds: 1
      period_seconds: 20
      timeout_seconds: 30
      failure_threshold: 15


  functest_databases_setup:
    description: Initializes the jethro_functest database with fresh sample data
    depends_on: 
      mariadb:
        condition: process_healthy
    command: |
      set -eu
      devbox.d/bin/jethro_load_demodata jethro_functest
      devbox.d/bin/mariadb_recreate_db jethro_functest_walkthrough jethro_functest_smsmockserver
      # Cancel any SMS deliveries still 'scheduled'. Each one renders a Datastar
      # polling span (?call=sms_info, backing off from every 2s per batch, for
      # up to 24h; see smsDeliveryPollIntervalSecs()) whose PHP-side status
      # call re-enters the same php-fpm pool, so leftovers saturate the pool
      # and unrelated tests time out. Re-run before every suite by
      # tests/functional/global-setup.ts.
      # (_smsdelivery: the smsdelivery view shows nothing without a current user.)
      mariadb jethro_functest -e "UPDATE _smsdelivery SET status='cancelled' WHERE status='scheduled'"
    on_exit:
      command: |
        if [ "$PC_EXIT_CODE" = 0 ]; then
          : #printf 'Functional-test databases initialized; sample data reset.\n'
        elif [ "$PC_STOP_REASON" = none ]; then
          printf 'Functional-test database setup failed (exit %s); test-server startup is blocked.\n' "$PC_EXIT_CODE" >&2
        fi
    readiness_probe:
      exec:
        command: mariadb jethro_functest -sNBe "select count(*) from _person;"
      # 1s delay, then ping every 1 second until up (try 15 times), and then every 20s
      initial_delay_seconds: 1
      startup_period_seconds: 1
      period_seconds: 20
      timeout_seconds: 5
      failure_threshold: 15


  # SMTP + REST API sink capturing every email the functest and dev Jethro send.
  # Listens on Unix domain sockets (no TCP ports, so concurrent checkouts never
  # clash): Jethro's mail reaches the SMTP socket via the SENDMAIL_COMMAND conf
  # define, and specs query the HTTP socket through
  # tests/functional/email/mailpit-api.ts (node http socketPath). --webroot puts the
  # UI and API under /emailmockserver/, which nginx proxies through unchanged. See
  # DEVELOPMENT_FUNCTESTS.md, "8. Email capture — MailPit (Unix domain sockets)".
  mailpit:
    command: |
      set -eu
      # Captured mail is not held in memory: MailPit writes it to a temporary
      # SQLite store, mailpit-<id>.db{,-wal,-shm}, which must stay private to the
      # checkout owner. umask 077 keeps the store files 0600 and creates the socket
      # directory private; TMPDIR keeps the store out of the shared /tmp.
      umask 077
      dir="$MAILPIT_SOCKET_DIR"
      mkdir -p "$dir"
      export TMPDIR="$dir"
      exec mailpit --smtp "unix:$dir/smtp.sock:600" --listen "unix:$dir/http.sock:600" --webroot /emailmockserver/ --max 500 --quiet
    availability:
      restart: "always"
    readiness_probe:
      exec:
        command: bash -c 'curl -sf --unix-socket "$MAILPIT_SOCKET_DIR/http.sock" http://localhost/emailmockserver/api/v1/messages'
      # 1s delay, then ping every 1 second until up (try 15 times), and then every 20s
      initial_delay_seconds: 1
      startup_period_seconds: 1
      period_seconds: 20
      timeout_seconds: 5
      failure_threshold: 15

  # FYI mariadb's service is provided by a devbox plugin, defined in .devbox/virtenv/mariadb/process-compose.yaml
