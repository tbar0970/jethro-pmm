[php]

; Absolute path via devbox env var (portable). PHP expands ${VAR} in php.ini
; values; a relative path would resolve against the script's directory under
; PHP-FPM, which varies per entry point (/members/, /public/, ...).
session.save_path = ${DEVBOX_PROJECT_ROOT}/.devbox/virtenv/php/sessions

; Put your php.ini directives here. For the latest default php.ini file, see https://github.com/php/php-src/blob/master/php.ini-production

; memory_limit = 128M
; expose_php = Off

; Jethro-specific. See https://github.com/tbar0970/jethro-pmm/pull/1497
; How many GET/POST/COOKIE input variables may be accepted
max_input_vars = 10000
post_max_size = 20M
upload_max_filesize = 20M
log_errors = On

[opcache]
; enable PHP bytecode caching
opcache.enable=1
; JIT should be off for Jethro. It just wastes time for one-shot PHP pages
;opcache.jit=tracing
;opcache.jit_buffer_size=128M

[xdebug]
; To enable xdebug, first run: devbox add php85Extensions.xdebug@latest
;xdebug.mode = off
;xdebug.mode = develop,debug
;xdebug.start_with_request = trigger
