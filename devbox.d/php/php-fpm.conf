[global]
pid = ${PHPFPM_PID_FILE}
; Note: this is PHP-FPM's error log, not PHP's (see below)
error_log = ${PHPFPM_ERROR_LOG_FILE}
daemonize = yes

[www]
; user = www-data
; group = www-data
; PHP-FPM listens on a unix socket rather than TCP — modelled on the mariadb
; plugin's MYSQL_UNIX_PORT: the path comes from the PHPFPM_UNIX_SOCKET env var,
; set by the devbox php plugin (default: .devbox/virtenv/php/php-fpm.sock).
listen = ${PHPFPM_UNIX_SOCKET}
; listen.owner = www-data
; listen.group = www-data
pm = dynamic
; Jethro calls the SMS mock server (smsmockserver/) over HTTP, and both are
; served by THIS pool: one page render occupies a child while it waits for a
; second child to answer its own request. With the functional suite running 8
; Playwright workers, a 20-child pool deadlocks — every child ends up waiting
; on a self-call that no child is free to serve, and each blocks for the SMS
; HttpRequest timeout (30s, see jethro-sms/src/HttpClient.php). Symptom: every
; request takes exactly 30s, nginx logs a wall of 499s, tests time out en masse.
; Keep enough headroom for (workers x (page + self-call + Datastar polls)).
pm.max_children = 60
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
chdir = /

; Note: PHP's error_log() output is typically found in your webserver error log, not in PHP-FPM's. By default error_log() writes to stderr (unless 'error_log' is set in php.log), and then on to the FastCGI client (the webserver), which logs it. If you want error_log() logged at the PHP-FPM layer, set a file here:
;
; php_admin_value[error_log] = ...
; php_admin_flag[log_errors] = on

; Pass through JETHRO_VERSION env var to devbox.d/functest_jethro_server/conf.php
env[JETHRO_VERSION] = ${JETHRO_VERSION}
; Pass Devbox's MYSQL_UNIX_PORT through to devbox.d/web/conf.php and smsmockserver/webroot/index.php
env[MYSQL_UNIX_PORT] = ${MYSQL_UNIX_PORT}
; The SMS mock server refuses to run unless this is set (smsmockserver/webroot/index.php)
env[SMSMOCK_ENABLED] = 1
; Extra profile dirs for the mock: Jethro's per-scenario .smsmock.php files.
; The mock's own bundled profiles/ is always loaded first (additive).
env[SMSMOCK_PROFILES] = ${DEVBOX_PROJECT_DIR}/tests/functional
