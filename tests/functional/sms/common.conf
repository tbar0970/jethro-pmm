// Shared config for every SMS scenario. The database itself is set up by the
// functest_databases_setup service (process-compose.yml), which runs
// `jethro_load_demodata jethro_functest`; connection details come from
// devbox.d/functest_jethro_server/conf.php (database jethro_functest, user
// jethro, password jethro - the devbox-wide convention).
//
// Scenario .conf files may override anything below. For example:
#define('PREFILL_USERNAME', 'demo');
#define('PREFILL_PASSWORD', 'qfntt7eYuwHs123');

define('SMS_VERBOSE', true);

// Do NOT hardcode ENABLED_FEATURES here: it silently disables every other
// feature (Notes, Attendance, Documents, ...) for the whole test run, not
// just narrows SMS-testing scope. Let it come from the `setting` table
// (loaded from the demo data by jethro_load_demodata) like a real instance would.
