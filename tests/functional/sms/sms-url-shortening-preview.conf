<?php
require_once __DIR__.'/common.conf';
define('SMS_PROVIDER', 'cellcast');
define('SMS_CELLCAST_APIKEY', 'test-mock-key');
// Test scenario: sms-url-shortening-preview
// SMS_SHORTEN_URLS ticks the form's "Shorten URLs" checkbox by default, so bare https:// URLs are auto-wrapped via %(shorten "...")%.
// Preview uses previewShorten() which is local/deterministic — no external call.
define('SMS_CELLCAST_URL', '/smsmockserver/tests/functional/sms/sms-url-shortening-preview');
define('SMS_SHORTEN_URLS', true);
// conf.php's production URLSHORTENER/JETHROAU_* defines are past the
// test-mode early-return, so they never run here — define them directly.
// previewShorten() is local/deterministic and ignores the API key; the
// shortening-enabled gate (JethroAu::serviceEnabled('url-shortener')) needs a
// supported URLSHORTENER, a non-empty key and url-shortener in JETHROAU_SERVICES.
define('URLSHORTENER', 'jethroau');
define('JETHROAU_API_KEY', 'test-mock-key');
define('JETHROAU_SERVICES', 'url-shortener');
