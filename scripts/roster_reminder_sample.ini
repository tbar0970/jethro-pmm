; Edit the values below and save as another filename, then run:
;   php /path/to/jethro/scripts/roster_reminder.php /path/to/your.ini
; Exits 1 if sending fails (for SMS: if the reminder reached nobody), so cron/healthchecks can alert on it.

; [required]
; Message type - either 'sms', 'email', or 'both'
MESSAGE_TYPE='both'

; [SMS + Email; required]
; Roster view number. This must be a public roster, i.e. visible under /public/, e.g. '/public/?view=display_roster&roster_view=1' The ID is visible in the URL (e.g. 1).
ROSTER_ID=1

; [Email only; required]
; The roster coordinator(s) receives a copy of the sent email (everyone else is Bcc'ed for privacy), plus a summary listing assignees w/o an email who might need to be notified manually.
; Enter a single email or multiple separate by a comma. Don't include spaces e.g. person@one.com.au,person@two.com.au.
ROSTER_COORDINATOR='roster-coordinator@church.something'

; [SMS only; optional]
; ID of a roster coordinator Person who receives a summary SMS: who the reminder was sent to and any failures,
; or that nobody was rostered. The coordinator is not sent the reminder itself unless they are rostered.
; Omit (or leave empty) to send no summary SMS; failures are then visible only via STDERR and the exit code.
ROSTER_COORDINATOR_ID=1

; [SMS + Email; required]
; First (intro) part of the SMS and/or email, before the rostered names.
; For SMS, <br> becomes a newline and other HTML tags are stripped.
; Three date placeholders are available (if several dates are rostered this week, all are listed):
;   {roster_date}         - full date, e.g. "Sunday, 29 April", or "Friday, 3 April or Sunday, 5 April" (good for email)
;   {roster_date_short}   - short date, e.g. "29 Apr", or "3 Apr/5 Apr" (good for SMS, saves characters)
;   {roster_day_of_week}  - day name only, e.g. "Sunday", or "Friday or Sunday"
; Other {...} names are not substituted and appear in the message as typed.
PRE_MESSAGE='This is a roster reminder for {roster_day_of_week}<br>'

; [SMS + Email; optional, default 1]
;Whether to include the roster content within the email or SMS. For SMS you probably want to set this to 0 and include a shortened URL in the PRE_MESSAGE instead.
INCLUDE_ROSTER_CONTENT=1

; [SMS + Email; required]
; Message after the roster list/table. E.g. who to contact if the recipient can't do the roster this week.
; Placeholders ('{roster_date}' etc) are substituted - see above.
POST_MESSAGE='The full roster can be viewed at xxx/jethro/public/?view=display_roster.<br> If you have any questions or difficulties or if you have arranged a swap, please contact the roster coordinator.<br><br> Thank you for serving on Sunday!<br>'

; [Email only; required]
; Set to 1 to format the roster content as a list rather than a table. For SMS it is always a list.
LIST_NOT_TABLE=1

; [Email only; required]
EMAIL_FROM='no-reply@church.something'
; [Email only; required]
EMAIL_FROM_NAME='no-reply'

; If OVERRIDE_EMAIL_FROM is set in conf.php, the EMAIL_FROM/EMAIL_FROM_NAME here become Reply-To instead,
; and the actual From address uses OVERRIDE_EMAIL_FROM (and OVERRIDE_EMAIL_FROM_NAME if set).

; [Email only; required]
; Email subject. Placeholders ('{roster_date}' etc) are substituted - see above.
EMAIL_SUBJECT='roster reminder - {roster_day_of_week}'

; [SMS only; required]
; The number or alphanumeric Sender ID (e.g. 'StBarnabas') that SMS reminders appear to come from.
; Leave empty ('') to use the sender configured in conf.php (SMS_SENDER_OPTIONS / SMS_SENDER).
SMS_FROM='000000000'

; [SMS + Email; optional, default 0]
; If set to 1, don't actually send anything, but print what would be sent.
; SMS: prints the message and recipients, then stops (so with MESSAGE_TYPE='both' no email is processed).
DEBUG=1

; [SMS + Email; optional, default 0]
; If set to 1, print the SMS summaries sent to the coordinator, and/or a summary of what emails were sent.
VERBOSE=1

; [Email only; optional, default 0]
; If your server does not like the built-in email class (Swift Mailer) try PHP mail() instead by setting this to 1.
PHP_MAIL=0

; [SMS + Email; optional, default 0]
; Normally people rostered in the upcoming week (today + 6 days inclusive) are notified. Setting START_DATE_OFFSET=7
; notifies those rostered the week after this.
; START_DATE_OFFSET=0

